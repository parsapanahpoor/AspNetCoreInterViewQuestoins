<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بانک سوالات مصاحبه | ASP.NET Core Backend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1e2836;
      --surface-hover: #243044;
      --text: #e8eef6;
      --muted: #9aa8bc;
      --line: #2d3a4d;
      --accent: #3d9cf0;
      --accent-soft: rgba(61, 156, 240, 0.12);
      --success: #3ecf8e;
      --tip-bg: rgba(62, 207, 142, 0.08);
      --tip-line: rgba(62, 207, 142, 0.45);
      --code-bg: rgba(0, 0, 0, 0.35);
      --code-text: #9fd0ff;
      --font: "Vazirmatn", system-ui, sans-serif;
      --measure: 46rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; color-scheme: dark; }

    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(61, 156, 240, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 0%, rgba(62, 207, 142, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    .wrap {
      width: min(var(--measure), calc(100% - 2rem));
      margin-inline: auto;
    }

    /* Top bar */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 20, 25, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .top-inner {
      padding: 0.85rem 0 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .brand .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .tools {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .tools button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .tools button:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    @media (max-width: 640px) {
      .controls { grid-template-columns: 1fr; }
      .top-row { flex-direction: column; align-items: flex-start; }
    }

    .controls input,
    .controls select {
      width: 100%;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      outline: none;
    }

    .controls input:focus,
    .controls select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Intro */
    .intro {
      padding: 1.5rem 0 0.5rem;
    }

    .intro p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 40rem;
    }

    .intro strong { color: var(--text); font-weight: 600; }

    /* Sections */
    .category-section {
      margin-top: 2rem;
      scroll-margin-top: 8.5rem;
    }

    .category-header {
      margin-bottom: 0.35rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--line);
    }

    .category-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      display: inline;
    }

    .category-header .count {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      margin-inline-start: 0.4rem;
    }

    .category-desc {
      display: none; /* quieter reading: hide long category blurbs */
    }

    /* Q&A */
    .qa-list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .qa-item + .qa-item {
      border-top: 1px solid var(--line);
    }

    .qa-question {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      text-align: right;
      padding: 0.95rem 1rem;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.6;
    }

    .qa-question:hover { background: var(--surface-hover); }

    .qa-item.open .qa-question { background: rgba(61, 156, 240, 0.06); }

    .q-num {
      flex-shrink: 0;
      min-width: 1.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      margin-top: 0.15rem;
      font-variant-numeric: tabular-nums;
    }

    .q-text { flex: 1; }

    .chevron {
      flex-shrink: 0;
      width: 1.15rem;
      height: 1.15rem;
      margin-top: 0.25rem;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .qa-item.open .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .qa-answer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }

    .qa-item.open .qa-answer { grid-template-rows: 1fr; }

    .qa-answer-inner {
      overflow: hidden;
      min-height: 0;
    }

    .qa-answer-body {
      padding: 0 1rem 1.1rem 2.4rem;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 400;
    }

    .qa-answer-body p + p { margin-top: 0.55rem; }

    .qa-answer-body strong {
      color: var(--text);
      font-weight: 700;
    }

    .qa-answer-body code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.84em;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 0.08em 0.32em;
      border-radius: 4px;
      direction: ltr;
      unicode-bidi: embed;
    }

    .qa-answer-body ul {
      margin: 0.45rem 0;
      padding-inline-start: 1.15rem;
    }

    .qa-answer-body li { margin-bottom: 0.2rem; }

    .tip {
      margin-top: 0.75rem;
      padding: 0.55rem 0.75rem;
      border-inline-start: 3px solid var(--tip-line);
      background: var(--tip-bg);
      color: #b8e6cf;
      font-size: 0.86rem;
      border-radius: 0 6px 6px 0;
    }

    .tip::before {
      content: "نکته: ";
      font-weight: 700;
      color: var(--success);
    }

    .empty-state {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }

    .empty-state.visible { display: block; }

    footer {
      margin-top: 3rem;
      padding: 1.25rem 0 2rem;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .qa-answer-body { padding-inline-start: 1rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="top-row">
        <div class="brand">
          <h1>بانک سوالات مصاحبه Backend</h1>
          <div class="meta"><span id="statQuestions">—</span> سوال در <span id="statCategories">—</span> موضوع · ASP.NET Core</div>
        </div>
        <div class="tools">
          <button type="button" id="expandAll">باز کردن همه</button>
          <button type="button" id="collapseAll">بستن همه</button>
        </div>
      </div>
      <div class="controls">
        <input type="search" id="searchInput" placeholder="جستجو در سوال‌ها و پاسخ‌ها..." autocomplete="off" />
        <select id="topicSelect" aria-label="پرش به موضوع">
          <option value="">پرش به موضوع...</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <p>
        روی هر سوال کلیک کنید تا پاسخ باز شود.
        پاسخ‌ها کوتاه و به سبک جلسه مصاحبه نوشته شده‌اند.
      </p>
    </div>

    <div class="empty-state" id="emptyState">نتیجه‌ای پیدا نشد.</div>
    <div id="content"></div>
  </main>

  <footer>
    <div class="wrap">ویژه استفاده آموزشی دانشجویان</div>
  </footer>

  <script src="questions-data.js"></script>
  <script>
    (function () {
      const content = document.getElementById("content");
      const topicSelect = document.getElementById("topicSelect");
      const searchInput = document.getElementById("searchInput");
      const emptyState = document.getElementById("emptyState");
      const data = window.INTERVIEW_BANK || [];

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatAnswer(answer) {
        let html = escapeHtml(answer);
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/(?:^|\s)TIP:\s*/g, "\nTIP:");
        html = html.replace(/^TIP:\s*(.+)$/gm, '<div class="tip">$1</div>');
        html = html.replace(/(?:^|\n)\s*-\s+(.+)/g, (m, item) => "\n<li>" + item + "</li>");
        if (html.includes("<li>")) {
          html = html.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g, (block) => "<ul>" + block + "</ul>");
        }
        html = html.replace(/\n\n/g, "</p><p>");
        html = "<p>" + html + "</p>";
        html = html.replace(/<p>\s*<ul>/g, "<ul>").replace(/<\/ul>\s*<\/p>/g, "</ul>");
        html = html.replace(/<p>\s*<div/g, "<div").replace(/<\/div>\s*<\/p>/g, "</div>");
        html = html.replace(/<p>\s*<\/p>/g, "");
        return html;
      }

      function render(filter = "") {
        const q = filter.trim().toLowerCase();
        content.innerHTML = "";
        topicSelect.innerHTML = '<option value="">پرش به موضوع...</option>';
        let totalVisible = 0;

        data.forEach((cat, catIdx) => {
          const items = cat.questions.filter((item) => {
            if (!q) return true;
            const hay = (item.q + " " + item.a + " " + cat.title).toLowerCase();
            return hay.includes(q);
          });

          if (!items.length) return;
          totalVisible += items.length;

          const id = "cat-" + catIdx;
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = cat.title + " (" + items.length + ")";
          topicSelect.appendChild(opt);

          const section = document.createElement("section");
          section.className = "category-section";
          section.id = id;

          const header = document.createElement("div");
          header.className = "category-header";
          header.innerHTML =
            "<h2>" + escapeHtml(cat.title) + '</h2><span class="count">' + items.length + " سوال</span>";
          section.appendChild(header);

          const list = document.createElement("div");
          list.className = "qa-list";

          items.forEach((item, i) => {
            const el = document.createElement("article");
            el.className = "qa-item";

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "qa-question";
            btn.setAttribute("aria-expanded", "false");
            btn.innerHTML =
              '<span class="q-num">' + (i + 1) + "</span>" +
              '<span class="q-text">' + escapeHtml(item.q) + "</span>" +
              '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

            const ans = document.createElement("div");
            ans.className = "qa-answer";
            ans.innerHTML =
              '<div class="qa-answer-inner"><div class="qa-answer-body">' +
              formatAnswer(item.a) +
              "</div></div>";

            btn.addEventListener("click", () => {
              const open = el.classList.toggle("open");
              btn.setAttribute("aria-expanded", open ? "true" : "false");
            });

            el.appendChild(btn);
            el.appendChild(ans);
            list.appendChild(el);
          });

          section.appendChild(list);
          content.appendChild(section);
        });

        document.getElementById("statQuestions").textContent = String(
          data.reduce((s, c) => s + c.questions.length, 0)
        );
        document.getElementById("statCategories").textContent = String(data.length);
        emptyState.classList.toggle("visible", totalVisible === 0);
      }

      document.getElementById("expandAll").addEventListener("click", () => {
        document.querySelectorAll(".qa-item").forEach((el) => {
          el.classList.add("open");
          const btn = el.querySelector(".qa-question");
          if (btn) btn.setAttribute("aria-expanded", "true");
        });
      });

      document.getElementById("collapseAll").addEventListener("click", () => {
        document.querySelectorAll(".qa-item").forEach((el) => {
          el.classList.remove("open");
          const btn = el.querySelector(".qa-question");
          if (btn) btn.setAttribute("aria-expanded", "false");
        });
      });

      topicSelect.addEventListener("change", () => {
        const id = topicSelect.value;
        if (!id) return;
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        topicSelect.value = "";
      });

      let timer;
      searchInput.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => render(searchInput.value), 180);
      });

      render();
    })();
  </script>
</body>
</html>
